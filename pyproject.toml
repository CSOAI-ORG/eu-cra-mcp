[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meok-eu-cra-mcp"
version = "0.1.0"
description = "EU Cyber Resilience Act (CRA, Regulation (EU) 2024/2847) compliance MCP server. 4 tools, 11 tests. Annex I essential cybersecurity requirements, vulnerability handling, SBOM, conformity assessment, NIS2 crosswalk. By MEOK AI Labs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MEOK AI Labs", email = "hello@meok.ai" }]
keywords = ["cra", "eu-cra", "cyber-resilience-act", "nis2", "sbom", "compliance", "mcp", "meok", "csoai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
meok-eu-cra-mcp = "meok_eu_cra_mcp.server:main"

[project.urls]
Homepage = "https://csoai.org"
Repository = "https://github.com/CSOAI-ORG/eu-cra-mcp"
Issues = "https://github.com/CSOAI-ORG/eu-cra-mcp/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["meok_eu_cra_mcp*"]
